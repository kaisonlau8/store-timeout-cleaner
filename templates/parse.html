<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据解析 - 门店超时提醒机器人统计</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>数据解析</h1>
            <p class="subtitle">上传最新的全量群清单和筛选群清单，解析后主页会自动更新</p>
        </header>

        <section class="upload-section">
            <div class="upload-box" id="all-upload">
                <div class="upload-icon">📁</div>
                <h3>全量群清单</h3>
                <p>拖拽或点击上传 Excel / ZIP 文件</p>
                <input type="file" id="all-file" accept=".xlsx,.xls,.zip" hidden>
                <div class="file-name" id="all-filename"></div>
            </div>
            <div class="upload-box" id="filter-upload">
                <div class="upload-icon">🤖</div>
                <h3>筛选群清单（已拉机器人）</h3>
                <p>拖拽或点击上传 Excel / ZIP 文件</p>
                <input type="file" id="filter-file" accept=".xlsx,.xls,.zip" hidden>
                <div class="file-name" id="filter-filename"></div>
            </div>
        </section>

        <button class="analyze-btn" id="analyze-btn" disabled>
            <span class="btn-text">开始解析</span>
            <span class="btn-loading" hidden>解析中...</span>
        </button>

        <div class="error-msg" id="error-msg" hidden></div>

        <div class="success-msg" id="success-msg" hidden>
            <h3>解析成功！</h3>
            <p>数据已保存，<a href="/">点击这里查看统计结果</a></p>
        </div>

        <div style="text-align:center;margin-top:24px;">
            <a href="/" style="color:#409eff;text-decoration:none;font-size:14px;">← 返回统计展示页</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/parse.js') }}"></script>
</body>
</html>
