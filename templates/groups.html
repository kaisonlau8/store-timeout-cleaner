<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群名统计 · 超时机器人统计</title>
    <link rel="icon" href="{{ url_for('static', filename='brand/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='brand/icon-16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/icon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='brand/icon-180.png') }}">
    <meta name="theme-color" content="#1677ff">
    <style>{{ ds_css()|safe }}</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stc-detail.css') }}?v=4">
</head>
<body>
    {{ ds_sprite()|safe }}
    <header class="ant-header"><div class="in">
        <a class="brand" href="/"><img class="brand-logo" src="{{ url_for('static', filename='brand/logo-blue.png') }}" srcset="{{ url_for('static', filename='brand/logo-blue@2x.png') }} 2x" alt="猛士" height="28">超时机器人统计</a>
        {% set nav_active = 'groups' %}
        {% include '_nav.html' %}
        <span class="cl-meta" id="synced-at">按群名关键字统计</span>
    </div></header>
    <div class="container">
        <header class="ant-page-header" data-ds-back="/" data-ds-back-label="首页">
            <div class="ant-page-header-heading">
                <h1>群名统计</h1>
                <div class="ant-page-header-sub">按客户群名称做关键字子串统计（大小写不敏感），数据来自 SCRM 同步的全量客户群</div>
            </div>
        </header>

        <div class="month-selector timeout-filters groups-filters list-filters">
            <div class="selector-group">
                <label for="keyword-input">关键字</label>
                <input type="text" id="keyword-input" value="X700-VIP" placeholder="输入群名关键字" autocomplete="off">
            </div>
            <div class="selector-group">
                <label for="theater-select">战区</label>
                <select id="theater-select">
                    <option value="">全部战区</option>
                </select>
            </div>
            <div class="selector-group">
                <label for="store-q">门店</label>
                <input type="search" id="store-q" placeholder="门店名称或编码" autocomplete="off">
            </div>
            <div class="selector-group">
                <label>筛选</label>
                <label class="ant-checkbox robot-checkbox"><input type="checkbox" id="robot-only">仅已拉机器人群</label>
            </div>
            <button class="filter-btn" id="query-btn" type="button"><svg class="ai" aria-hidden="true"><use href="#i-search"/></svg>查询</button>
            <a class="export-link groups-export" id="export-btn" href="/api/groups/keyword/export" title="导出 Excel（汇总 / 按战区 / 按门店 / 未归店群 / 群明细）"><svg class="ai" aria-hidden="true"><use href="#i-file-excel"/></svg>导出 Excel</a>
        </div>

        <p class="error-msg" id="groups-error" hidden></p>

        <div id="groups-result" hidden>
            <div class="summary-cards groups-cards" id="groups-cards"></div>

            <div class="stats-grid groups-tables">
                <div class="stat-block">
                    <div class="table-head"><h3>按战区</h3><span class="chart-hint table-hint">点击行可按该战区筛选</span></div>
                    <div class="store-table-wrapper">
                        <table class="store-table" id="theater-table" data-ds-primary>
                            <thead><tr><th data-card-title>战区</th><th>群数</th><th>门店数</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="stat-block">
                    <div class="table-head"><h3>按门店</h3><span class="chart-hint table-hint">点击战区可筛选</span></div>
                    <div class="store-table-wrapper">
                        <table class="store-table" id="store-table" data-ds-primary>
                            <thead><tr><th>排名</th><th data-card-title>门店</th><th>战区</th><th>群数</th><th>已拉机器人</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="stat-block groups-unmatched">
                <div class="table-head"><h3>未归店群</h3><span class="chart-hint table-hint">群主部门缺门店或战区，无法归店</span></div>
                <div class="store-table-wrapper">
                    <table class="store-table" id="unmatched-table">
                        <thead><tr><th data-card-title>群名</th><th>是否已拉机器人</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="no-data" id="groups-empty" hidden>
            <div class="ant-empty">
                <div class="ant-empty-image"><svg class="ai" aria-hidden="true"><use href="#i-inbox"/></svg></div>
                <h2 class="ant-empty-title">没有匹配的客户群</h2>
                <p class="ant-empty-desc" id="empty-desc">当前关键字与筛选条件下暂无群名匹配，换个关键字试试</p>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/stc-detail.js') }}?v=5"></script>
    <script src="{{ url_for('static', filename='js/groups.js') }}?v=4"></script>
    <script>{{ ds_cards()|safe }}</script>
</body>
</html>
