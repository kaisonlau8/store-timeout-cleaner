<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超时提醒统计</title>
    <link rel="icon" href="{{ url_for('static', filename='brand/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='brand/icon-16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/icon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='brand/icon-180.png') }}">
    <meta name="theme-color" content="#1677ff">
    <style>{{ ds_css()|safe }}</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/antd-feedback.css') }}?v=2">
</head>
<body>
    {{ ds_sprite()|safe }}
    <header class="ant-header"><div class="in">
        <a class="brand" href="/"><img class="brand-logo" src="{{ url_for('static', filename='brand/logo-blue.png') }}" srcset="{{ url_for('static', filename='brand/logo-blue@2x.png') }} 2x" alt="猛士" height="28">超时机器人统计</a>
        <nav class="page-nav" aria-label="主导航">
            <a class="page-nav-link" href="/"><svg class="ai" aria-hidden="true"><use href="#i-bar-chart"/></svg>拉群覆盖</a>
            <a class="page-nav-link active" href="/timeout"><svg class="ai" aria-hidden="true"><use href="#i-clock-circle"/></svg>超时提醒</a>
            <a class="page-nav-link" href="/groups"><svg class="ai" aria-hidden="true"><use href="#i-team"/></svg>群名统计</a>
            <a class="page-nav-link" href="/score"><svg class="ai" aria-hidden="true"><use href="#i-audit"/></svg>超时评分</a>
        </nav>
        <span class="cl-meta" id="updated-at">按文件名时间范围登记</span>
    </div></header>
    <div class="container">
        <header class="ant-page-header">
            <div class="ant-page-header-heading">
                <h1>超时提醒统计</h1>
                <div class="ant-page-header-sub">导入管家「回复超时记录」Excel，按文件名时间范围登记</div>
            </div>
        </header>

        <div class="stat-block import-panel" id="import-panel">
            <div class="table-head">
                <h3>导出登记</h3>
                <label class="export-link import-upload" id="import-upload" data-loading-text="上传中">
                    <svg class="ai" aria-hidden="true"><use href="#i-upload"/></svg>
                    <span data-btn-label>上传 Excel</span>
                    <input type="file" id="excel-file" accept=".xlsx,.xls" hidden>
                </label>
            </div>
            <p class="chart-hint">文件名需带时间范围，例如 <code>导出时间范围20260701-20260731回复超时记录.xlsx</code>。放入 <code>input_file/</code> 或在此上传，同一区间会覆盖重导。</p>
            <div class="ant-upload-list" id="import-progress" hidden>
                <div class="ant-upload-list-item">
                    <span class="ant-upload-list-item-name" id="import-progress-name"></span>
                    <div class="ant-progress ant-progress-line ant-progress-status-active ant-progress-show-info" id="import-progress-bar">
                        <div class="ant-progress-outer">
                            <div class="ant-progress-inner">
                                <div class="ant-progress-bg" id="import-progress-bg" style="width:0%"></div>
                            </div>
                        </div>
                        <span class="ant-progress-text" id="import-progress-text">0%</span>
                    </div>
                </div>
            </div>
            <p class="error-msg" id="import-error" hidden></p>
            <div class="store-table-wrapper">
                <table class="store-table" id="import-table">
                    <thead>
                        <tr><th data-card-title>时间范围</th><th>文件</th><th>行数</th><th>计入</th><th>未归店</th><th>导入时间</th></tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" style="text-align:center" class="cl-muted">尚未导入</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="month-selector timeout-filters">
            <div class="selector-group">
                <label>战区</label>
                <select id="theater-select">
                    <option value="">全国 / 全部战区</option>
                </select>
            </div>
            <div class="selector-group">
                <label>门店</label>
                <input id="store-input" list="store-list" placeholder="全部或输入店名" autocomplete="off">
                <datalist id="store-list"></datalist>
            </div>
            <div class="selector-group">
                <label>粒度</label>
                <div class="grain-pills">
                    <label class="toggle-btn"><input type="radio" name="grain" value="day"> 日</label>
                    <label class="toggle-btn active"><input type="radio" name="grain" value="month" checked> 月</label>
                    <label class="toggle-btn"><input type="radio" name="grain" value="quarter"> 季</label>
                </div>
            </div>
            <div class="selector-group">
                <label>开始</label>
                <input type="date" id="start-date" value="2026-05-01">
            </div>
            <div class="selector-group">
                <label>结束</label>
                <input type="date" id="end-date">
            </div>
            <button class="filter-btn" id="filter-btn" type="button" data-loading-text="查询中"><span data-btn-label>查询</span></button>
        </div>

        <div id="timeout-results">
        <div class="summary-cards" id="total-cards"></div>
        <div class="summary-cards rule-cards" id="rule-cards"></div>

        <div class="chart-card">
            <h3>超时提醒趋势</h3>
            <p class="chart-hint">实线为计入超时的客户消息数；虚线为各规则触发次数。数据来自管家导出。</p>
            <div class="chart-wrap">
                <canvas id="timeout-chart"></canvas>
            </div>
        </div>

        <div class="stat-block store-block">
            <div class="table-head">
                <h3>门店明细</h3>
                <a class="export-link" id="export-link" data-antd-export data-loading-text="导出中" href="/api/timeout/export"><span data-btn-label>导出 CSV</span></a>
            </div>
            <div class="store-table-wrapper timeout-table-wrap">
                <table class="store-table" id="store-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/antd-feedback.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/timeout.js') }}?v=4"></script>
    <script>{{ ds_cards()|safe }}</script>
</body>
</html>
